# Deploy privacy + terms static pages to GitHub Pages
name: github-pages

on:
  push:
    branches: [master]
    paths:
      - 'privacy/**'
      - 'terms/**'
      - 'index.html'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder
        run: |
          mkdir -p site/privacy site/terms
          cp index.html site/
          cp privacy/index.html site/privacy/
          cp terms/index.html site/terms/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
